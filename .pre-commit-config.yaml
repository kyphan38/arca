repos:
  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.45.0
    hooks:
      - id: markdownlint
        name: Markdownlint (Node.js)
        description: Run markdownlint-cli on your Markdown files
        files: \.(md|mdown|markdown|myst)$
        exclude: ^(\.rules/|AGENTS\.md|CLAUDE\.md)$
        args: [--ignore, .rules, --ignore, AGENTS.md, --ignore, CLAUDE.md]
  - repo: local
    hooks:
      - id: docs-structure-check
        name: Docs Structure Check
        entry: python scripts/lint.py
        language: python
        pass_filenames: false 
        types: [markdown]
        files: ^docs/